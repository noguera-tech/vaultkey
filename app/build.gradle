plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.nogueratech.vaultkey'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nogueratech.vaultkey'
        minSdk 23
        targetSdk 35
        versionCode 36
        versionName '2.7.0-webview-candidate'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        iconBackgroundDiagnostic {
            initWith debug
            applicationIdSuffix '.iconbackgrounddiagnostic'
            versionNameSuffix '-iconbackgrounddiagnostic'
            debuggable true
        }
        iconDiagnostic {
            initWith debug
            applicationIdSuffix '.icondiagnostic'
            versionNameSuffix '-icondiagnostic'
            debuggable true
        }
        cameraResultFix {
            initWith debug
            applicationIdSuffix '.cameraresultfix'
            versionNameSuffix '-cameraresultfix'
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
implementation 'androidx.core:core:1.16.0'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
}
